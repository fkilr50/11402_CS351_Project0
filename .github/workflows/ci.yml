name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build-type: [Release, Debug]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build

      - name: Display environment info
        run: |
          g++ --version
          cmake --version
          ninja --version
      
      - name: Configure project
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
      
      - name: Build project
        run: cmake --build build --config ${{ matrix.build-type }}
      
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -V
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.build-type }}
          path: build/Testing/

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      
      - name: Check code formatting
        run: |
          clang-format --version
          find src -name "*.cpp" -o -name "*.h" | while read file; do
            echo "Checking format of $file"
            clang-format --dry-run -Werror "$file" || true
          done
